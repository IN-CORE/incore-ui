name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'

    tags:
      - '*'

  pull_request:
    branches:
      - main
      - develop
      - 'release/*'

env:
  MAIN_REPO: IN-CORE/incore-ui

jobs:

  # ----------------------------------------------------------------------
  # NODE BUILD
  # ----------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"

    steps:
      # checkout source code
      - uses: actions/checkout@v7

      # setup node
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # install dependencies
      - name: install dependencies
        run: npm ci

      # compile UI
      - name: build
        run: npm run build
